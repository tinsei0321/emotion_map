# EMC × dsh 双机环境清单（PT-CB16 S2·M2）

placeholders:
  repo: "{REPO}"
  dsh_home: "{DSH_HOME}"

versions:
  dsh: "0.1.1-rc.2"            # office 实测；home 必须一致或记录差异
  node: "v24.16.0"
  python: "3.14.5"
  dsh_mcp_client: "@deepseek-ai/dsh-mcp-client@0.1.1-rc.2"
  emc_branch: "EMC_Codex_Harness"
  transformers: "5.14.1"       # PT-CB15 K7 注记：5.x 对 bge-small-zh-v1.5 需 AutoTokenizer 兜底
  sentence_transformers: "5.7.0"

rag:
  model: "BAAI/bge-small-zh-v1.5"
  index_dir: "{REPO}/DATA/RAG/rag_index"
  rebuild_command: "HF_HUB_OFFLINE=1 py tools/rag_index.py --rebuild"
  stale_check: "py tools/rag_index.py --rebuild-if-stale"

services:
  mcp_emc: "http://127.0.0.1:8600/mcp"
  backend: "http://127.0.0.1:8000"
  frontend: "http://127.0.0.1:8080"

notes:
  - "密钥不入库；check 只报存在性不报值。"
  - "node_modules/junction 不复制，按版本命令重建。"
  - "RAG 索引/模型缓存为派生资产，重建命令如上。"
